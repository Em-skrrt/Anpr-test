<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANPR Test</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 20px;
  background: #f2f2f2;
}

.container {
  max-width: 600px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 15px;
}

h1 {
  text-align: center;
}

input, button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  box-sizing: border-box;
  font-size: 16px;
}

button {
  border: none;
  border-radius: 8px;
  background: #222;
  color: white;
}

button:disabled {
  opacity: 0.5;
}

img {
  width: 100%;
  margin-top: 15px;
  border-radius: 10px;
}

.result {
  margin-top: 20px;
  padding: 15px;
  background: #eee;
  border-radius: 10px;
}

#status {
  margin-top: 15px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<h1>🚗 ANPR Test</h1>

<input type="file" id="imageInput" accept="image/*">

<img id="preview" style="display:none;">

<button id="scanButton" disabled>
🔎 Läs registreringsskylt
</button>

<button id="testButton">
🧪 Testläge
</button>

<div id="status"></div>

<div class="result">
  <b>Registreringsnummer:</b>
  <div id="plate">-</div>

  <br>

  <b>OCR-säkerhet:</b>
  <div id="confidence">-</div>

  <br>

  <b>OCR-text:</b>
  <div id="raw">-</div>
</div>

</div>

<script>

const imageInput = document.getElementById("imageInput");
const preview = document.getElementById("preview");
const scanButton = document.getElementById("scanButton");

let selectedImage = null;

imageInput.addEventListener("change", function() {

  const file = this.files[0];

  if (!file) return;

  selectedImage = file;

  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";

  scanButton.disabled = false;

  document.getElementById("status").textContent =
    "Bild vald. Tryck på Läs registreringsskylt.";

});


function createProcessedImage(source, mode) {

  return new Promise((resolve) => {

    const img = new Image();

    img.onload = function() {

      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      const scale = Math.max(2, 1600 / img.width);

      canvas.width = img.width * scale;
      canvas.height = img.height * scale;

      ctx.drawImage(
        img,
        0,
        0,
        canvas.width,
        canvas.height
      );

      const imageData =
        ctx.getImageData(
          0,
          0,
          canvas.width,
          canvas.height
        );

      const data = imageData.data;

      for (let i = 0; i < data.length; i += 4) {

        let r = data[i];
        let g = data[i + 1];
        let b = data[i + 2];

        let gray =
          0.299 * r +
          0.587 * g +
          0.114 * b;

        if (mode === 1) {

          gray = Math.min(
            255,
            Math.max(
              0,
              (gray - 128) * 1.8 + 128
            )
          );

        }

        if (mode === 2) {

          gray =
            gray > 140 ? 255 : 0;

        }

        data[i] = gray;
        data[i + 1] = gray;
        data[i + 2] = gray;

      }

      ctx.putImageData(imageData, 0, 0);

      resolve(canvas);

    };

    img.src = URL.createObjectURL(source);

  });

}


function findPlate(text) {

  const clean = text
    .toUpperCase()
    .replace(/[^A-Z0-9]/g, "");

  const patterns = [

    /[A-Z]{3}[0-9]{3}/,
    /[A-Z]{3}[0-9]{2}[A-Z]/

  ];

  for (const pattern of patterns) {

    const match = clean.match(pattern);

    if (match) {
      return match[0];
    }

  }

  return null;

}


scanButton.addEventListener("click", async function() {

  if (!selectedImage) return;

  scanButton.disabled = true;

  document.getElementById("status").textContent =
    "🔄 Förbättrar bilden...";

  document.getElementById("plate").textContent = "-";
  document.getElementById("confidence").textContent = "-";
  document.getElementById("raw").textContent = "-";

  let bestPlate = null;
  let bestConfidence = 0;
  let bestText = "";

  try {

    for (let mode = 0; mode < 3; mode++) {

      document.getElementById("status").textContent =
        "🔎 OCR försöker version " + (mode + 1) + " av 3...";

      const processed =
        await createProcessedImage(selectedImage, mode);

      const result =
        await Tesseract.recognize(
          processed,
          "eng",
          {
            logger: m => {

              if (m.status === "recognizing text") {

                document.getElementById("status").textContent =
                  "🔎 Läser text... " +
                  Math.round(m.progress * 100) +
                  "%";

              }

            }
          }
        );

      const text = result.data.text;
      const confidence = result.data.confidence || 0;

      const plate = findPlate(text);

      if (plate && confidence > bestConfidence) {

        bestPlate = plate;
        bestConfidence = confidence;
        bestText = text;

      }

    }

    if (bestPlate) {

      document.getElementById("plate").textContent =
        bestPlate;

      document.getElementById("confidence").textContent =
        Math.round(bestConfidence) + "%";

      document.getElementById("raw").textContent =
        bestText;

      document.getElementById("status").textContent =
        "✅ Registreringsnummer hittat!";

    } else {

      document.getElementById("status").textContent =
        "❌ Hittade inget tydligt registreringsnummer.";

      document.getElementById("raw").textContent =
        "Försök med en tydligare bild.";

    }

  } catch (error) {

    console.error(error);

    document.getElementById("status").textContent =
      "⚠️ Något gick fel vid OCR.";

  }

  scanButton.disabled = false;

});


document.getElementById("testButton")
.addEventListener("click", function() {

  document.getElementById("plate").textContent =
    "ABC123";

  document.getElementById("confidence").textContent =
    "100%";

  document.getElementById("raw").textContent =
    "ABC123";

  document.getElementById("status").textContent =
    "🧪 Testläge";

});

</script>

</body>
</html>
